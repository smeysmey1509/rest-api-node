      context: .
      dockerfile: services/catalog-service/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: catalog-service
      PORT: 5103
    expose:
      - "5103"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5103/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  inventory-service:
