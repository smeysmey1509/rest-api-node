    environment:
      <<: *service-env
      SERVICE_NAME: order-service
      PORT: 5105
    expose:
      - "5105"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5105/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
